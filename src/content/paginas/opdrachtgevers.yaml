titel: Voor ondernemers — De Club van 100
beschrijving: >-
  Je krijgt geen willekeurige invalkracht. Je krijgt iemand die weet hoe een tap
  onder druk werkt. Wij regelen de mensen in en rond Groningen.
secties:
  - discriminant: hero
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      bovenkop: ""
      kop: "Voor onder\xADnemers."
      tekst: ""
      knop:
        label: ""
        href: ""
      tweedeKnop:
        label: ""
        href: ""
      schicht: true
  - discriminant: rijke-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: smal
      # De aanhef en de twee alinea's van pagina 2 van de mockup, letterlijk;
      # zie bron/mockup-teksten.md. Rijke tekst en geen kop-tekst, want een
      # tekstveld rendert één alinea en dit zijn er twee.
      kop: Echte mensen. *Geen nummertjes, maar [1 van de 100].*
      schichtLijst: false
      inhoud: |
        Een vol terras. Een groot evenement. Iemand die onverwacht uitvalt. Of simpelweg een weekend waarin je nét wat extra handen kunt gebruiken. De Club van 100 koppelt horecazaken en evenementen aan een vaste community van flexibele horecamedewerkers.

        Geen eindeloze zoektocht naar personeel, maar toegang tot een club mensen die graag werkt en zelf kiest wanneer ze beschikbaar zijn.
  - discriminant: drie-kolommen
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: ""
      kop: Wat je krijgt
      items:
        - nummer: "01"
          kop: Honderd avonden ervaring
          tekst: Iedereen die hier staat, heeft honderd avonden achter een bar gestaan.
          href: ""
        - nummer: "02"
          kop: Geen willekeurige invalkracht
          tekst: Je krijgt iemand die weet hoe een tap onder druk werkt.
          href: ""
        - nummer: "03"
          kop: Honderd is de grens
          tekst: >-
            Honderd is geen willekeurig getal. Je hoort erbij of je hoort er
            niet bij.
          href: ""
  - discriminant: beeld-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Waarom geen uitzendbureau
      kop: Een uitzendbureau werft. Deze club selecteert.
      tekst: >-
        Wij zeggen niet dat we goed zijn. We laten merken dat niet iedereen mee
        mag doen. Dat is het hele verschil met een uitzendbureau: geen standaard
        uitzendkrachten, maar mensen die er uitspringen.
      beeld:
        bron: /beeld/bediening-buiten.jpg
        alt: Bediening aan tafel, daglicht onder de bomen
      verhouding: breed
      beeldPositie: links
  - discriminant: citaten
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Wat opdrachtgevers zeggen
      items:
        - citaat: >-
            "Zeker een leuke avond gehad en top mensen hebben jullie gestuurd.
            Ze hebben het fantastisch gedaan."
          naam: De Speld
          rol: ""
        - citaat: '"Leuke mensen, harde werkers"'
          naam: Stadslab Groningen
          rol: ""
  - discriminant: accordeon
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: smal
      bovenkop: ""
      kop: Veelgestelde vragen
      items:
        - vraag: Wat kost het?
          antwoord: |
            Het factuurtarief hangt af van het soort opdracht en de werkzaamheden. Neem contact op en je hoort direct het actuele tarief.
        - vraag: Hoe snel kunnen jullie iemand regelen?
          antwoord: |
            Vraag bij voorkeur zo vroeg mogelijk aan, maar last-minute kan ook — als er iemand beschikbaar is soms dezelfde dag nog. Een inzet is definitief zodra wij hem bevestigd hebben.
        - vraag: Wat als er iemand niet komt opdagen?
          antwoord: |
            Neem direct contact op met De Club. Wij benaderen meteen beschikbare Clubleden en regelen zo snel mogelijk vervanging. Je betaalt nooit voor niet-gewerkte uren.
        - vraag: Hoe zit het met de factuur?
          antwoord: |
            Je krijgt achteraf een factuur op basis van de daadwerkelijk gewerkte uren. Betaaltermijn: 30 dagen.
        - vraag: Werken jullie ook buiten Groningen?
          antwoord: |
            We zitten in Groningen, maar inzet kan door heel Nederland — afhankelijk van de opdracht en de beschikbaarheid van Clubleden.
        - vraag: Wat voor werk pakken jullie aan?
          antwoord: |
            Bediening, bar, barista's, gastheren en gastvrouwen, festivals, evenementen, garderobe en afwas. Breed inzetbaar binnen horeca en events.
        - vraag: Wat is de minimale afname?
          antwoord: |
            Vanaf één medewerker. Er is geen minimum per opdracht.
  - discriminant: oproep
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      bovenkop: Aan de slag
      kop: Goede mensen op het moment dat je ze {nodig hebt.}
      tekst: Mail wat het is en wanneer. Je hoort binnen een dag van ons.
      knop:
        label: Inhuren
        href: /contact
      knopKleur: vuur
      tweedeKnop:
        label: ""
        href: ""
