titel: Voor wie is de club? — De Club van 100
beschrijving: >-
  Honderd plekken. Niet iedereen komt erdoor. Iedereen die hier staat, heeft
  honderd avonden achter een bar gestaan.
secties:
  - discriminant: hero
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      bovenkop: De 100
      kop: Voor wie is de club?
      tekst: Honderd plekken. Je hoort erbij of je hoort er niet bij.
      knop:
        label: ""
        href: ""
      tweedeKnop:
        label: ""
        href: ""
      schicht: true
  - discriminant: beeld-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Wie erin zitten
      kop: Geen standaard uitzendkrachten
      tekst: Iedereen die hier staat, heeft honderd avonden achter een bar gestaan.
      beeld:
        bron: /beeld/cocktail-bar.jpg
        alt: Iemand maakt een cocktail achter de buitenbar
      verhouding: breed
      beeldPositie: rechts
  - discriminant: kop-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: ""
      # Twee letterrollen in één kop. Het typemachinedeel is korter dan in de
      # mockup: alleen de slotwoorden, niet de halve zin. Dat is een bewuste
      # afwijking — zie bron/mockup-notities.md.
      kop: >-
        Voor mensen die graag werken, maar niet willen dat hun *[hele agenda]
        wordt bepaald door hun bijbaan.*
      tekst: ""
  - discriminant: kop-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Waarom honderd
      kop: Het is de grens.
      tekst: >-
        Honderd is geen willekeurig getal. Zit de honderd vol, dan bellen we als
        er een plek vrijkomt.
  - discriminant: beeld-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Waarom we bestaan
      kop: Mensen die er uitspringen
      tekst: >-
        Wij misten een plek waar mensen die veel ervaring hebben in de horeca en
        events samen komen. Geen standaard uitzendkrachten, maar mensen die er
        uitspringen.
      beeld:
        bron: /beeld/vuur-zonsondergang.jpg
        alt: Vuurkorf op het festivalterrein in tegenlicht
      verhouding: breed
      beeldPositie: rechts
  - discriminant: drie-kolommen
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: ""
      kop: ""
      items:
        - nummer: ""
          kop: Work when you want.
          tekst: ""
          href: ""
        - nummer: ""
          kop: Where you want.
          tekst: ""
          href: ""
        - nummer: ""
          kop: With people you like.
          tekst: ""
          href: ""
      handschrift: Work when you want. Where you want. With people you like.
  - discriminant: accordeon
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: smal
      bovenkop: ""
      kop: Veelgestelde vragen
      items:
        - vraag: Wat verdien ik?
          antwoord: |
            Je wordt verloond via 365Werk. Je loon hangt af van je leeftijd en de functie, en je ziet vooraf wat een dienst je oplevert. De week na je gewerkte dienst staat het op je rekening — uitbetaling is altijd op donderdag.
        - vraag: Wat zijn de eisen?
          antwoord: |
            Je bent minimaal 18, sociaal en representatief, en je komt afspraken na. Horeca-ervaring vermeld je bij je aanmelding; een horecadiploma is niet nodig. Vertel vooral waar je enthousiast van wordt.
        - vraag: Hoe werkt aanmelden en hoe lang duurt het?
          antwoord: |
            Je meldt je online aan, vult je horeca-ervaring in en vertelt waar je enthousiast van wordt. Daarna volgt een korte kennismaking en beoordelen we of je bij De Club past. Past het? Dan kun je aan de slag.
        - vraag: Zit ik ergens aan vast?
          antwoord: |
            Nee. Geen vast rooster, geen minimum aantal diensten, geen verplicht aantal uren. Je kiest zelf welke diensten je aanneemt — maar een aangenomen dienst is wel een afspraak.
        - vraag: Hoe word ik uitbetaald en wanneer?
          antwoord: |
            Via 365Werk, geen zzp-constructie. Je gewerkte uren worden doorgegeven en de week na je dienst uitbetaald, altijd op donderdag.
  - discriminant: oproep
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      bovenkop: Meld je
      kop: Omdat groter niet altijd {beter is.}
      tekst: >-
        Denk je dat jij een van de betere achter de bar van de stad bent, laat
        het weten.
      knop:
        label: Ik wil bij jullie werken
        href: /contact
      tweedeKnop:
        label: ""
        href: ""
